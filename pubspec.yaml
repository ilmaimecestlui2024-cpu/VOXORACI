name: voxora_studio
description: Voxora Studio — Studio vocal, multi-piste, mixage et mastering en direct sur Android (Flutter + C++ / Oboe).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
