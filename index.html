    <script>
      (function () {
        try {
          var d = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (d && d.configurable && d.get && !d.set) {
            var currentFetch = d.get.call(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: d.enumerable,
              get: function () { return currentFetch; },
              set: function (v) { currentFetch = v; }
            });
          }
        } catch (_) {}
        window.addEventListener('error', function (e) {
          var src = e && (e.filename || (e.error && e.error.stack) || '');
          if (typeof src === 'string' && (src.indexOf('chrome-extension://') !== -1 || src.indexOf('moz-extension://') === 0)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Voxora Studio — Studio Vocal, Mixage & Mastering</title>
