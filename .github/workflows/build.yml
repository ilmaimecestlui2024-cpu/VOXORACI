name: Build Voxora Studio APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"
          cache: true

      - name: Préparer l'arborescence Voxora Studio
        run: |
          mkdir -p lib tools android/app/src/main/cpp
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f voxora.cpp ] && mv voxora.cpp android/app/src/main/cpp/voxora.cpp || true
          [ -f CMakeLists.txt ] && mv CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt || true
          [ -f setup_android.py ] && mv setup_android.py tools/setup_android.py || true

      - name: Générer le projet Android et restaurer les sources Dart
        run: |
          cp -r lib /tmp/voxora_lib
          cp pubspec.yaml /tmp/voxora_pubspec.yaml
          flutter create --platforms=android --project-name voxora_studio --org com.voxora.studio .
          rm -rf lib
          cp -r /tmp/voxora_lib lib
          cp /tmp/voxora_pubspec.yaml pubspec.yaml

      - name: Configurer CMake, Oboe et permissions Android
        run: python3 tools/setup_android.py

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Vérifier le code Dart
        run: flutter analyze

      - name: Compiler l'APK Release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: voxora-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
